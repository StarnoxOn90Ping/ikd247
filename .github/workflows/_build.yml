name: Kiwami Build (shared steps)

# Shared by Alpha, Beta and Release. Not run on its own - the three workflows call it.
# Secrets are passed in with "secrets: inherit" and are only ever used as environment
# variables on the runner. GitHub masks them in logs, and the decoded keystore lives in a
# temp folder that is deleted at the end of the job. It is never cached or uploaded.

on:
  workflow_call:
    inputs:
      gradle-task:
        description: "Gradle task to run, e.g. assembleGoogleAlpha"
        required: true
        type: string
      apk-dir:
        description: "Folder under app/build/outputs/apk/google/ (alpha, debug or release)"
        required: true
        type: string
      artifact-name:
        description: "Name of the uploaded artifact"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CI: true

    steps:
    - name: Checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Setup JDK
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
      with:
        distribution: 'temurin'
        java-version: 25

    # Only downloaded libraries and the Gradle wrapper are cached. No secrets, no keystore.
    - name: Cache Gradle dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: v1-${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          v1-${{ runner.os }}-gradle-

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Prepare signing key
      env:
        KIWAMI_KEYSTORE_BASE64: ${{ secrets.KIWAMI_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KIWAMI_KEYSTORE_BASE64" ]; then
          echo "$KIWAMI_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kiwami.jks"
          echo "KIWAMI_KEYSTORE_PATH=$RUNNER_TEMP/kiwami.jks" >> "$GITHUB_ENV"
          echo "Signing with the Kiwami key"
        else
          echo "No signing key set, falling back to the debug key"
        fi

    - name: Build
      env:
        GRADLE_TASK: ${{ inputs.gradle-task }}
        KIWAMI_KEYSTORE_PASSWORD: ${{ secrets.KIWAMI_KEYSTORE_PASSWORD }}
        KIWAMI_KEY_ALIAS: ${{ secrets.KIWAMI_KEY_ALIAS }}
        KIWAMI_KEY_PASSWORD: ${{ secrets.KIWAMI_KEY_PASSWORD }}
      run: ./gradlew "$GRADLE_TASK" -Pkiwami.arm64Only=true

    - name: Show built APK
      env:
        APK_DIR: ${{ inputs.apk-dir }}
      run: |
        ls -lh app/build/outputs/apk/google/"$APK_DIR"/*arm64-v8a*.apk | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Upload APK
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        retention-days: 1
        compression-level: 0
        if-no-files-found: error
        path: app/build/outputs/apk/google/${{ inputs.apk-dir }}/*arm64-v8a*.apk

    - name: Remove signing key
      if: ${{ always() }}
      run: rm -f "$RUNNER_TEMP/kiwami.jks"
