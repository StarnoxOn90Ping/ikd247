name: Release apk

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/_build.yml
    with:
      gradle-task: assembleGoogleRelease
      apk-dir: release
      artifact-name: Kiwami-Release
    secrets: inherit
