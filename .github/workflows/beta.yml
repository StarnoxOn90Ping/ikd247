name: Beta apk

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/_build.yml
    with:
      gradle-task: assembleGoogleDebug
      apk-dir: debug
      artifact-name: Kiwami-Beta
    secrets: inherit
