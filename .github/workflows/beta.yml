name: Build APK

on:
  push:
    tags:
      - "v*.*.*"
    branches-ignore:
      - l10n_dev_crowdin
    paths-ignore:
      - '**/README.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI: true

    steps:
    - name: Checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Setup JDK
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
      with:
        distribution: 'temurin'
        java-version: 25

    - name: Cache Gradle dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: v1-${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          v1-${{ runner.os }}-gradle-

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Prepare signing key
      env:
        KIWAMI_KEYSTORE_BASE64: ${{ secrets.KIWAMI_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KIWAMI_KEYSTORE_BASE64" ]; then
          echo "$KIWAMI_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kiwami.jks"
          echo "KIWAMI_KEYSTORE_PATH=$RUNNER_TEMP/kiwami.jks" >> "$GITHUB_ENV"
          echo "Signing with the Kiwami key"
        else
          echo "No signing key set, falling back to the debug key"
        fi

    - name: Build with Gradle
      env:
        KIWAMI_KEYSTORE_PASSWORD: ${{ secrets.KIWAMI_KEYSTORE_PASSWORD }}
        KIWAMI_KEY_ALIAS: ${{ secrets.KIWAMI_KEY_ALIAS }}
        KIWAMI_KEY_PASSWORD: ${{ secrets.KIWAMI_KEY_PASSWORD }}
      run: ./gradlew assembleGoogleAlpha

    - name: Upload APK as artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: Kiwami
        retention-days: 5
        compression-level: 0
        path: "app/build/outputs/apk/**/*arm64-v8a*.apk"
